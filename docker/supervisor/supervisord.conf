; Управляет php-fpm и nginx как двумя независимыми процессами в одном
; контейнере (docker/php/Dockerfile.dokploy) — Dokploy Application даёт
; один Dockerfile = один контейнер, supervisor решает "два процесса в
; одном" вместо docker-compose с отдельными сервисами. autorestart=true —
; если упадёт php-fpm, а не весь контейнер, supervisor поднимет только его,
; а не оставит nginx жить дальше и отдавать 502 до ручного перезапуска.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; startretries по умолчанию — 3, дальше supervisor сдаётся насовсем (FATAL)
; и больше не пробует перезапустить, даже когда причина сбоя исчезла —
; проверено намеренным падением: после исчерпания попыток php-fpm оставался
; мёртвым бесконечно, а nginx продолжал отвечать (тихий наполовину живой
; контейнер, 502 вместо честного падения). 1000 — практически "пробовать
; всегда", тот же принцип, что restart: unless-stopped на уровне compose.
[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
