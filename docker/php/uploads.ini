; OrderMediaController::MAX_FILE_KB = 20 МБ (ТЗ п.88 — CRM/сайт грузят фото/видео
; заказа через Internal API multipart, не через Telegram). PHP-дефолт php:8.4-fpm
; (upload_max_filesize=2M, post_max_size=8M) обрезает всё крупнее 2 МБ ДО того,
; как файл доходит до валидации Laravel — запрос просто теряет файл без понятной
; ошибки о размере. 25M/30M — с запасом над лимитом контроллера и вровень с
; client_max_body_size в nginx (см. docker/nginx/*.conf).
upload_max_filesize=25M
post_max_size=30M
