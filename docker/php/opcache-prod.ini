opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; 0 — не проверять mtime на каждом запросе (дороже) и не подхватывать правки файлов
; без рестарта контейнера. Осознанно для прода — деплой всегда через пересборку
; образа (см. docker/php/Dockerfile.prod), "живая правка файла в контейнере" не
; входит в рабочий процесс, а проверка mtime на каждый запрос — чистые накладные
; расходы без пользы.
opcache.validate_timestamps=0
opcache.save_comments=1
