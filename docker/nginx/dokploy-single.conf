# Вариант nginx-конфига для docker/php/Dockerfile.dokploy — php-fpm в ТОМ ЖЕ
# контейнере (127.0.0.1), не отдельным сервисом compose (там fastcgi_pass
# app:9000, см. docker/nginx/default.conf). Alpine-пакет nginx подключает
# /etc/nginx/http.d/*.conf (не /etc/nginx/conf.d/, как в официальном образе
# nginx:alpine) — проверено эмпирически, не угадано.
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }
}
