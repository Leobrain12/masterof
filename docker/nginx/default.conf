# Чисто API/бот-бэкенд (см. README — интерфейс только Telegram-бот), статики
# в public/ нет — try_files всегда падает в /index.php, поэтому nginx не нужен
# доступ к исходникам приложения, только к php-fpm через fastcgi_pass.
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # Лимит выше, чем 20 МБ в OrderMediaController — с запасом на служебные заголовки.
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }
}
