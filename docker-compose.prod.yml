# Прод-контур: PHP-FPM + nginx вместо artisan serve, restart-политики на всём
# (упавший контейнер поднимается сам), БД/Redis не торчат наружу (нет ports:,
# только внутренняя сеть compose), код запечён в образ при сборке — не том.
#
# db/redis без ports: — доступны только другим сервисам этого compose-файла
# по имени (app/queue могут подключиться к "db:5432", хосту порт не виден).
#
# Планировщик (db:backup, system:health-check, model:prune) НЕ поднят отдельным
# контейнером — cron на самом хосте вызывает schedule:run раз в минуту
# (см. README#Деплой-в-прод), тот же паттерн, что уже описан в разделах
# "Бэкапы"/"Мониторинг"/"Очистка". Отдельный контейнер-цикл дублировал бы это.
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage:/var/www/storage
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Для голого сервера без Dokploy — публикуем 80 на хост, TLS терминирует
    # Caddy/nginx-хоста перед этим стеком (см. README#Деплой-в-прод). Деплой
    # через Dokploy использует другой файл — docker-compose.dokploy.yml —
    # там порт НЕ публикуется, потому что 80/443 на хосте держит сам Dokploy.
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    # --max-time — воркер сам выходит раз в час, restart: unless-stopped поднимает
    # заново: периодический цикл жизни против накопления памяти в долгоживущем
    # процессе, дешевле, чем городить supervisor внутри контейнера.
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=2
    volumes:
      - storage:/var/www/storage
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  dbdata:
  redisdata:
  storage:
