# Вариант для Dokploy с ОТДЕЛЬНЫМИ ресурсами Database/Redis (созданы в самом
# Dokploy, не здесь) — в отличие от docker-compose.prod.yml, где db/redis
# самодостаточны внутри того же файла (для голого сервера без Dokploy).
# Дублировать БД/Redis сервисами в этом файле не нужно и вредно — два разных
# Postgres с одинаковым именем базы только всё запутают.
#
# DB_HOST/DB_PORT/REDIS_HOST/REDIS_PORT в .env (задаётся в Environment
# Settings самого Dokploy) должны указывать на реальные Internal Host/Port
# ресурсов Database/Redis — смотреть в их собственных карточках в Dokploy,
# не выдумывать по аналогии с именем сервиса.
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage:/var/www/storage

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Без ports: — Traefik самого Dokploy уже держит 80/443 на хосте и сам
    # достаёт этот сервис по внутренней docker-сети через Domains в UI.
    expose:
      - "80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    # --max-time — воркер сам выходит раз в час, restart: unless-stopped поднимает
    # заново: периодический цикл жизни против накопления памяти в долгоживущем
    # процессе, дешевле, чем городить supervisor внутри контейнера.
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=2
    volumes:
      - storage:/var/www/storage

volumes:
  storage:
